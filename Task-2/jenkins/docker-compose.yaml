services:
  jenkins:
    build: .
    container_name: jenkins
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - terraform_plugin_cache:/tmp/terraform-plugin-cache
    restart: unless-stopped

volumes:
  jenkins_home:
  terraform_plugin_cache:
